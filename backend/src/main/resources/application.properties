spring.application.name=trustpay-backend

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/trustpay}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt-secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}

trustpay.admin.bootstrap-enabled=${ADMIN_BOOTSTRAP_ENABLED:false}
trustpay.admin.email=${ADMIN_EMAIL:}
trustpay.admin.password=${ADMIN_PASSWORD:}
trustpay.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200}

server.port=${SERVER_PORT:8080}

logging.level.com.trustpay.backend=${LOG_LEVEL:INFO}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
